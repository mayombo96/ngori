<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MAMO SERVICES - PS4 Exploit Host</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --mamo-blue-primary: #0056b3;
            --mamo-blue-electric: #0088ff;
            --mamo-blue-light: #e6f2ff;
            --bg-body: #0d1b2a;
            --text-white: #ffffff;
            --accent-gold: #38bdf8; /* Harmonisé avec le bleu électrique/cyan de ton identité */
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .logo {
            max-width: 220px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 136, 255, 0.3);
        }

        h1 {
            color: var(--text-white);
            font-size: 24px;
            margin-top: 15px;
        }

        hr {
            border: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--mamo-blue-electric), transparent);
            width: 60%;
            margin: 15px auto;
        }

        .btn {
            background-color: var(--mamo-blue-primary);
            color: var(--text-white);
            border: none;
            padding: 12px 22px;
            margin: 8px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 86, 179, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover, .btn:focus {
            background-color: var(--mamo-blue-electric);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 136, 255, 0.6);
            outline: none;
        }

        a {
            text-decoration: none;
        }

        #crypto {
            display: none;
            background: #1b263b;
            padding: 20px;
            border-radius: 12px;
            max-width: 450px;
            margin: 20px auto;
            border: 1px solid var(--mamo-blue-electric);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .crypto-addr {
            font-size: 0.8rem; 
            color: var(--accent-gold); 
            margin: 8px 0; 
            word-break: break-all; 
            font-family: monospace;
            background: rgba(0,0,0,0.2);
            padding: 6px;
            border-radius: 4px;
        }
    </style>
</head>
